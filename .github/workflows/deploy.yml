name: Deploy to cPanel

# Chỉ chạy khi bấm "Run workflow"
# Chạy trên máy bạn (self-hosted) vì firewall cPanel chặn IP GitHub Actions
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build meta
        id: meta
        run: |
          echo "started_at=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"
          PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          echo "ssh_port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        id: fe_install
        continue-on-error: true
        working-directory: portal.solexpress
        run: npm ci

      - name: Build frontend
        id: fe_build
        continue-on-error: true
        if: steps.fe_install.outcome == 'success'
        working-directory: portal.solexpress
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false
        run: npm run build

      - name: Prepare deploy packages
        id: prepare
        continue-on-error: true
        if: steps.fe_build.outcome == 'success'
        run: |
          rm -rf deploy
          mkdir -p deploy/backend deploy/frontend

          if command -v rsync >/dev/null 2>&1; then
            rsync -a \
              --exclude 'node_modules' \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude 'src/logs' \
              --exclude '*.zip' \
              --exclude '.vscode' \
              backend.solexpress/ deploy/backend/
            rsync -a portal.solexpress/build/ deploy/frontend/
          else
            # Windows Git Bash fallback (no rsync)
            cp -R backend.solexpress/. deploy/backend/
            rm -rf deploy/backend/node_modules deploy/backend/src/logs 2>/dev/null || true
            rm -f deploy/backend/.env deploy/backend/.env.* 2>/dev/null || true
            cp -R portal.solexpress/build/. deploy/frontend/
          fi

          tar -czf solexpress-deploy.tar.gz -C deploy backend frontend
          ls -lh solexpress-deploy.tar.gz

      - name: Upload & deploy via SSH (from your PC IP)
        id: deploy_ssh
        continue-on-error: true
        if: steps.prepare.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ steps.meta.outputs.ssh_port }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          BE_REMOTE_PATH: ${{ secrets.BE_REMOTE_PATH }}
          FE_REMOTE_PATH: ${{ secrets.FE_REMOTE_PATH }}
          NODE_VENV_PATH: ${{ secrets.NODE_VENV_PATH }}
        run: |
          set -euo pipefail

          KEY_FILE="$HOME/.ssh/github_actions_deploy_key"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh" 2>/dev/null || true
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE" 2>/dev/null || true

          # Fix ACL on Windows OpenSSH if available
          if command -v icacls.exe >/dev/null 2>&1; then
            icacls.exe "$(cygpath -w "$KEY_FILE" 2>/dev/null || echo "$KEY_FILE")" /inheritance:r >/dev/null 2>&1 || true
          fi

          ASKPASS="$HOME/.ssh/askpass_deploy.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$ASKPASS" 2>/dev/null || true

          eval "$(ssh-agent -s)"
          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            DISPLAY="${DISPLAY:-:0}" SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force \
              ssh-add "$KEY_FILE" </dev/null
          else
            ssh-add "$KEY_FILE" </dev/null
          fi

          SSH_COMMON=(-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          REMOTE="${SSH_USERNAME}@${SSH_HOST}"
          REMOTE_DIR="/home/${SSH_USERNAME}/solexpress-ci"

          echo "==> SSH test"
          ssh "${SSH_COMMON[@]}" -p "$SSH_PORT" "$REMOTE" "mkdir -p '$REMOTE_DIR' && echo SSH_OK"

          echo "==> Upload archive"
          scp "${SSH_COMMON[@]}" -P "$SSH_PORT" \
            solexpress-deploy.tar.gz \
            "${REMOTE}:${REMOTE_DIR}/solexpress-deploy.tar.gz"

          echo "==> Extract, sync, npm install, restart"
          ssh "${SSH_COMMON[@]}" -p "$SSH_PORT" "$REMOTE" bash -s <<EOF
          set -e
          BE_PATH='$BE_REMOTE_PATH'
          FE_PATH='$FE_REMOTE_PATH'
          NODE_VENV='$NODE_VENV_PATH'
          CI_DIR="\$HOME/solexpress-ci"

          mkdir -p "\$CI_DIR/extract"
          tar -xzf "\$CI_DIR/solexpress-deploy.tar.gz" -C "\$CI_DIR/extract"

          mkdir -p "\$BE_PATH" "\$FE_PATH"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude '.env' --exclude '.env.*' --exclude 'node_modules' --exclude 'src/logs' \
              "\$CI_DIR/extract/backend/" "\$BE_PATH/"
            rsync -a "\$CI_DIR/extract/frontend/" "\$FE_PATH/"
          else
            cp -R "\$CI_DIR/extract/backend/." "\$BE_PATH/"
            cp -R "\$CI_DIR/extract/frontend/." "\$FE_PATH/"
          fi

          cd "\$BE_PATH"
          if [ -n "\$NODE_VENV" ] && [ -f "\$NODE_VENV/bin/activate" ]; then
            # shellcheck disable=SC1090
            source "\$NODE_VENV/bin/activate"
          fi
          npm install --production --omit=dev

          mkdir -p "\$BE_PATH/tmp"
          touch "\$BE_PATH/tmp/restart.txt"
          rm -rf "\$CI_DIR"
          echo "Deploy finished OK"
          EOF

          echo "Deploy pipeline OK"

      - name: Evaluate results
        id: result
        if: always()
        run: |
          FE_OK=false
          BE_OK=false
          ERRORS=""

          if [ "${{ steps.fe_install.outcome }}" != "success" ]; then
            ERRORS="- Frontend: npm ci thất bại"
          elif [ "${{ steps.fe_build.outcome }}" != "success" ]; then
            ERRORS="- Frontend: build thất bại"
          elif [ "${{ steps.prepare.outcome }}" != "success" ]; then
            ERRORS="- Chuẩn bị package thất bại"
          elif [ "${{ steps.deploy_ssh.outcome }}" != "success" ]; then
            ERRORS="- Deploy SSH thất bại (kiểm tra self-hosted runner đang online + SSH key)"
          else
            FE_OK=true
            BE_OK=true
            ERRORS="Không có"
          fi

          {
            echo "fe_ok=$FE_OK"
            echo "be_ok=$BE_OK"
            echo "errors<<EOF"
            echo "$ERRORS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$FE_OK" = "true" ] && [ "$BE_OK" = "true" ]; then
            echo "overall=success" >> "$GITHUB_OUTPUT"
          else
            echo "overall=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ACTOR: ${{ steps.meta.outputs.actor }}
          STARTED_AT: ${{ steps.meta.outputs.started_at }}
          FE_OK: ${{ steps.result.outputs.fe_ok }}
          BE_OK: ${{ steps.result.outputs.be_ok }}
          OVERALL: ${{ steps.result.outputs.overall }}
          ERRORS: ${{ steps.result.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FINISHED_AT=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          if [ "$OVERALL" = "success" ]; then
            TITLE="✅ Deploy THÀNH CÔNG"
          else
            TITLE="❌ Deploy THẤT BẠI"
          fi

          if [ "$FE_OK" = "true" ]; then FE_STATUS="✅ Thành công"; else FE_STATUS="❌ Thất bại"; fi
          if [ "$BE_OK" = "true" ]; then BE_STATUS="✅ Thành công"; else BE_STATUS="❌ Thất bại"; fi

          ERRORS_ESCAPED=$(printf '%s' "$ERRORS" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          MESSAGE=$(cat <<EOF
          <b>${TITLE}</b>

          <b>Nhánh:</b> <code>${BRANCH}</code>
          <b>Người chạy:</b> <code>${ACTOR}</code>
          <b>Bắt đầu:</b> <code>${STARTED_AT}</code>
          <b>Kết thúc:</b> <code>${FINISHED_AT}</code>
          <b>Runner:</b> self-hosted (máy local)

          <b>Frontend:</b> ${FE_STATUS}
          <b>Backend:</b> ${BE_STATUS}

          <b>Lỗi:</b>
          <pre>${ERRORS_ESCAPED}</pre>

          <a href="${RUN_URL}">Xem chi tiết trên GitHub Actions</a>
          EOF
          )

          MESSAGE=$(printf '%s' "$MESSAGE" | sed 's/^[[:space:]]*//')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${MESSAGE}"

      - name: Fail job if deploy incomplete
        if: always() && steps.result.outputs.overall != 'success'
        run: |
          echo "Deploy thất bại — xem Telegram / log Actions"
          exit 1
