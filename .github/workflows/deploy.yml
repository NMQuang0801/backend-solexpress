name: Deploy to cPanel

# Chỉ chạy khi bấm "Run workflow"
# Chạy trên máy bạn (self-hosted Windows) vì firewall cPanel chặn IP GitHub Actions
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Ghi chu (khong bat buoc)"
        required: false
        default: "manual deploy"

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build meta
        id: meta
        run: |
          $started = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss") + " UTC"
          "started_at=$started" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "branch=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "actor=$env:GITHUB_ACTOR" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $port = "${{ secrets.SSH_PORT }}"
          if ([string]::IsNullOrWhiteSpace($port)) { $port = "22" }
          "ssh_port=$port" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        id: fe_install
        continue-on-error: true
        working-directory: portal.solexpress
        run: npm ci

      - name: Build frontend
        id: fe_build
        continue-on-error: true
        if: steps.fe_install.outcome == 'success'
        working-directory: portal.solexpress
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: "false"
        run: npm run build

      - name: Prepare deploy packages
        id: prepare
        continue-on-error: true
        if: steps.fe_build.outcome == 'success'
        run: |
          if (Test-Path deploy) { Remove-Item -Recurse -Force deploy }
          New-Item -ItemType Directory -Force -Path deploy\backend, deploy\frontend | Out-Null

          robocopy backend.solexpress deploy\backend /E /XD node_modules src\logs .vscode /XF *.zip .env .env.* /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy backend failed: $LASTEXITCODE" }

          robocopy portal.solexpress\build deploy\frontend /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy frontend failed: $LASTEXITCODE" }

          if (Test-Path solexpress-deploy.tar.gz) { Remove-Item -Force solexpress-deploy.tar.gz }
          tar -czf solexpress-deploy.tar.gz -C deploy backend frontend
          Get-Item solexpress-deploy.tar.gz | Format-List Name, Length

      - name: Upload & deploy via SSH
        id: deploy_ssh
        continue-on-error: true
        timeout-minutes: 20
        if: steps.prepare.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ steps.meta.outputs.ssh_port }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          BE_REMOTE_PATH: ${{ secrets.BE_REMOTE_PATH }}
          FE_REMOTE_PATH: ${{ secrets.FE_REMOTE_PATH }}
          NODE_VENV_PATH: ${{ secrets.NODE_VENV_PATH }}
        run: |
          $ErrorActionPreference = "Stop"

          # Ten file tam tren may runner (KHONG phai ten key cPanel).
          # Noi dung key lay tu secret SSH_PRIVATE_KEY (= private key github_ci).
          $sshDir = Join-Path $env:RUNNER_TEMP "solexpress-ssh-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyFile = Join-Path $sshDir "github_ci"

          if ([string]::IsNullOrWhiteSpace($env:SSH_PRIVATE_KEY)) {
            throw "Secret SSH_PRIVATE_KEY trong. Hay paste private key github_ci vao GitHub Secrets."
          }

          $key = ($env:SSH_PRIVATE_KEY -replace "`r", "").Trim() + "`n"
          [System.IO.File]::WriteAllText($keyFile, $key)

          # Chi sau khi ghi xong moi siet ACL (tranh Access denied lan sau)
          icacls $keyFile /inheritance:r | Out-Null
          icacls $keyFile /grant:r "$($env:USERNAME):(R)" | Out-Null

          Write-Host "Using temp key file: $keyFile"

          $hostName = $env:SSH_HOST
          $user = $env:SSH_USERNAME
          $port = $env:SSH_PORT
          $remote = "${user}@${hostName}"
          $remoteDir = "/home/${user}/solexpress-ci"
          $passphrase = $env:SSH_KEY_PASSPHRASE

          $keyEncrypted = $key -match "ENCRYPTED|Proc-Type:\s*4,ENCRYPTED|bcrypt"
          $useAgent = $false

          if ($keyEncrypted) {
            if ([string]::IsNullOrWhiteSpace($passphrase)) {
              throw "Private key co passphrase nhung secret SSH_KEY_PASSPHRASE dang trong. Them SSH_KEY_PASSPHRASE hoac tao key local khong pass roi Import .pub len cPanel."
            }

            Write-Host "==> Unlock key bang SSH_ASKPASS (khong treo)"
            $svc = Get-Service ssh-agent -ErrorAction SilentlyContinue
            if ($null -eq $svc) {
              throw "Thieu ssh-agent service. Bat OpenSSH Authentication Agent trong Services."
            }
            if ($svc.StartType -eq "Disabled") {
              throw "ssh-agent dang Disabled. Chay Admin PowerShell: Set-Service ssh-agent -StartupType Manual; Start-Service ssh-agent"
            }
            if ($svc.Status -ne "Running") { Start-Service ssh-agent }

            # askpass.cmd: OpenSSH goi khi stdin khong phai TTY
            $askpass = Join-Path $sshDir "github_askpass.cmd"
            $passFile = Join-Path $sshDir "github_askpass_secret.txt"
            [System.IO.File]::WriteAllText($passFile, $passphrase)
            icacls $passFile /inheritance:r | Out-Null
            icacls $passFile /grant:r "$($env:USERNAME):(R)" | Out-Null
            [System.IO.File]::WriteAllText($askpass, "@echo off`r`ntype `"$passFile`"`r`n")

            $env:DISPLAY = "1"
            $env:SSH_ASKPASS = $askpass
            $env:SSH_ASKPASS_REQUIRE = "force"

            $nul = Join-Path $env:TEMP "ssh_add_nul.txt"
            Set-Content -Path $nul -Value ""
            $p = Start-Process -FilePath "ssh-add.exe" -ArgumentList "`"$keyFile`"" `
              -NoNewWindow -Wait -PassThru `
              -RedirectStandardInput $nul `
              -RedirectStandardOutput (Join-Path $env:TEMP "ssh_add_out.txt") `
              -RedirectStandardError (Join-Path $env:TEMP "ssh_add_err.txt")

            Remove-Item $passFile, $askpass, $nul -Force -ErrorAction SilentlyContinue
            if (Test-Path (Join-Path $env:TEMP "ssh_add_err.txt")) {
              Get-Content (Join-Path $env:TEMP "ssh_add_err.txt") | Write-Host
            }

            if ($p.ExitCode -ne 0) {
              throw "ssh-add that bai (exit $($p.ExitCode)). Passphrase sai, hoac tao key local khong pass roi Import .pub len cPanel."
            }

            $useAgent = $true
            Write-Host "Key unlocked OK"
          }

          $sshBase = @(
            "-o", "BatchMode=yes",
            "-o", "IdentitiesOnly=yes",
            "-o", "StrictHostKeyChecking=accept-new",
            "-o", "ConnectTimeout=20",
            "-o", "ServerAliveInterval=15",
            "-o", "ServerAliveCountMax=6",
            "-p", $port
          )
          if (-not $useAgent) { $sshBase += @("-i", $keyFile) }

          # Tai su dung 1 TCP SSH (tranh firewall CSF cat nhieu connection)
          $controlPath = Join-Path $sshDir "cm-%C"
          $mux = @(
            "-o", "ControlMaster=auto",
            "-o", "ControlPath=$controlPath",
            "-o", "ControlPersist=180"
          )

          $be = $env:BE_REMOTE_PATH.TrimEnd('/')
          $fe = $env:FE_REMOTE_PATH.TrimEnd('/')
          $venv = $env:NODE_VENV_PATH

          $deploySh = Join-Path $sshDir "deploy-remote.sh"
          $deployLines = @(
            '#!/bin/bash',
            'set -euo pipefail',
            "BE_PATH='$be'",
            "FE_PATH='$fe'",
            "NODE_VENV='$venv'",
            "CI_DIR='$remoteDir'",
            'echo "==> extract"',
            'mkdir -p "$CI_DIR/extract"',
            'tar -xzf "$CI_DIR/solexpress-deploy.tar.gz" -C "$CI_DIR/extract"',
            'echo "==> sync backend/frontend"',
            'mkdir -p "$BE_PATH" "$FE_PATH"',
            'cp -R "$CI_DIR/extract/backend/." "$BE_PATH/"',
            'cp -R "$CI_DIR/extract/frontend/." "$FE_PATH/"',
            'echo "==> npm install"',
            'cd "$BE_PATH"',
            'if [ -n "$NODE_VENV" ] && [ -f "$NODE_VENV/bin/activate" ]; then source "$NODE_VENV/bin/activate"; fi',
            'npm install --production --omit=dev',
            'echo "==> restart passenger"',
            'mkdir -p "$BE_PATH/tmp"',
            'touch "$BE_PATH/tmp/restart.txt"',
            'rm -rf "$CI_DIR/extract" "$CI_DIR/solexpress-deploy.tar.gz" "$CI_DIR/deploy-remote.sh"',
            'echo Deploy finished OK'
          )
          [System.IO.File]::WriteAllText($deploySh, (($deployLines -join "`n") + "`n"))

          Write-Host "==> Open SSH master + mkdir"
          & ssh @sshBase @mux $remote "mkdir -p '$remoteDir'"
          if ($LASTEXITCODE -ne 0) { throw "SSH mkdir failed" }

          Write-Host "==> Upload archive + deploy script"
          $scpArgs = @(
            "-o", "BatchMode=yes",
            "-o", "IdentitiesOnly=yes",
            "-o", "StrictHostKeyChecking=accept-new",
            "-o", "ConnectTimeout=20",
            "-o", "ControlMaster=auto",
            "-o", "ControlPath=$controlPath",
            "-o", "ControlPersist=180",
            "-P", $port
          )
          if (-not $useAgent) { $scpArgs += @("-i", $keyFile) }
          & scp @scpArgs "solexpress-deploy.tar.gz" $deploySh "${remote}:${remoteDir}/"
          if ($LASTEXITCODE -ne 0) { throw "SCP upload failed" }

          Write-Host "==> Run remote deploy script"
          & ssh @sshBase @mux $remote "bash '$remoteDir/deploy-remote.sh'"
          if ($LASTEXITCODE -ne 0) { throw "Remote deploy script failed" }

          Write-Host "==> Close SSH master"
          & ssh @sshBase @mux -O exit $remote 2>$null

          Write-Host "Deploy pipeline OK"

      - name: Evaluate results
        id: result
        if: always()
        run: |
          $feOk = "false"
          $beOk = "false"
          $errors = ""

          if ("${{ steps.fe_install.outcome }}" -ne "success") {
            $errors = "- Frontend: npm ci that bai"
          } elseif ("${{ steps.fe_build.outcome }}" -ne "success") {
            $errors = "- Frontend: build that bai"
          } elseif ("${{ steps.prepare.outcome }}" -ne "success") {
            $errors = "- Chuan bi package that bai"
          } elseif ("${{ steps.deploy_ssh.outcome }}" -ne "success") {
            $errors = "- Deploy SSH that bai (runner online + SSH key/passphrase)"
          } else {
            $feOk = "true"
            $beOk = "true"
            $errors = "Khong co"
          }

          "fe_ok=$feOk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "be_ok=$beOk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "errors<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $errors | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($feOk -eq "true" -and $beOk -eq "true") {
            "overall=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "overall=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ACTOR: ${{ steps.meta.outputs.actor }}
          STARTED_AT: ${{ steps.meta.outputs.started_at }}
          FE_OK: ${{ steps.result.outputs.fe_ok }}
          BE_OK: ${{ steps.result.outputs.be_ok }}
          OVERALL: ${{ steps.result.outputs.overall }}
          ERRORS: ${{ steps.result.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $finished = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss") + " UTC"
          if ($env:OVERALL -eq "success") { $title = "✅ Deploy THANH CONG" } else { $title = "❌ Deploy THAT BAI" }
          if ($env:FE_OK -eq "true") { $fe = "✅ Thanh cong" } else { $fe = "❌ That bai" }
          if ($env:BE_OK -eq "true") { $be = "✅ Thanh cong" } else { $be = "❌ That bai" }

          $err = [System.Net.WebUtility]::HtmlEncode($env:ERRORS)
          $text = @"
          <b>$title</b>

          <b>Nhanh:</b> <code>$($env:BRANCH)</code>
          <b>Nguoi chay:</b> <code>$($env:ACTOR)</code>
          <b>Bat dau:</b> <code>$($env:STARTED_AT)</code>
          <b>Ket thuc:</b> <code>$finished</code>
          <b>Runner:</b> self-hosted Windows

          <b>Frontend:</b> $fe
          <b>Backend:</b> $be

          <b>Loi:</b>
          <pre>$err</pre>

          <a href="$($env:RUN_URL)">Xem chi tiet GitHub Actions</a>
          "@

          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            parse_mode = "HTML"
            text = $text
          }
          Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -Body $body | Out-Null

      - name: Fail job if deploy incomplete
        if: always() && steps.result.outputs.overall != 'success'
        run: |
          Write-Error "Deploy that bai — xem Telegram / log Actions"
          exit 1
