name: Deploy to cPanel

# Chỉ chạy khi bấm "Run workflow"
# Chạy trên máy bạn (self-hosted Windows) vì firewall cPanel chặn IP GitHub Actions
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build meta
        id: meta
        run: |
          $started = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss") + " UTC"
          "started_at=$started" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "branch=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "actor=$env:GITHUB_ACTOR" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $port = "${{ secrets.SSH_PORT }}"
          if ([string]::IsNullOrWhiteSpace($port)) { $port = "22" }
          "ssh_port=$port" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        id: fe_install
        continue-on-error: true
        working-directory: portal.solexpress
        run: npm ci

      - name: Build frontend
        id: fe_build
        continue-on-error: true
        if: steps.fe_install.outcome == 'success'
        working-directory: portal.solexpress
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: "false"
        run: npm run build

      - name: Prepare deploy packages
        id: prepare
        continue-on-error: true
        if: steps.fe_build.outcome == 'success'
        run: |
          if (Test-Path deploy) { Remove-Item -Recurse -Force deploy }
          New-Item -ItemType Directory -Force -Path deploy\backend, deploy\frontend | Out-Null

          robocopy backend.solexpress deploy\backend /E /XD node_modules src\logs .vscode /XF *.zip .env .env.* /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy backend failed: $LASTEXITCODE" }

          robocopy portal.solexpress\build deploy\frontend /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy frontend failed: $LASTEXITCODE" }

          if (Test-Path solexpress-deploy.tar.gz) { Remove-Item -Force solexpress-deploy.tar.gz }
          tar -czf solexpress-deploy.tar.gz -C deploy backend frontend
          Get-Item solexpress-deploy.tar.gz | Format-List Name, Length

      - name: Upload & deploy via SSH
        id: deploy_ssh
        continue-on-error: true
        timeout-minutes: 8
        if: steps.prepare.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ steps.meta.outputs.ssh_port }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BE_REMOTE_PATH: ${{ secrets.BE_REMOTE_PATH }}
          FE_REMOTE_PATH: ${{ secrets.FE_REMOTE_PATH }}
          NODE_VENV_PATH: ${{ secrets.NODE_VENV_PATH }}
        run: |
          $ErrorActionPreference = "Stop"

          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyFile = Join-Path $sshDir "github_actions_deploy_key"

          $key = ($env:SSH_PRIVATE_KEY -replace "`r", "").Trim() + "`n"
          [System.IO.File]::WriteAllText($keyFile, $key)

          icacls $keyFile /inheritance:r | Out-Null
          icacls $keyFile /grant:r "$($env:USERNAME):(R)" | Out-Null

          # Key co passphrase se lam CI TREO. Bat buoc dung key KHONG passphrase.
          if ($key -match "ENCRYPTED|Proc-Type:\s*4,ENCRYPTED|bcrypt") {
            throw @"
Private key dang bi khoa bang passphrase.
Tren Windows runner, ssh-add se TREO cho nhap tay.

Cach fix (2 phut):
1) cPanel -> SSH Access -> Manage SSH Keys -> Generate
2) Key Name: github_ci
3) Key Password: DE TRONG
4) Authorize key
5) Download Private Key -> paste vao secret SSH_PRIVATE_KEY
6) Xoa secret SSH_KEY_PASSPHRASE (neu co)
"@
          }

          $hostName = $env:SSH_HOST
          $user = $env:SSH_USERNAME
          $port = $env:SSH_PORT
          $remote = "${user}@${hostName}"
          $remoteDir = "/home/${user}/solexpress-ci"

          # BatchMode=yes: khong hoi passphrase/password -> fail nhanh, khong treo
          $sshBase = @(
            "-o", "BatchMode=yes",
            "-o", "IdentitiesOnly=yes",
            "-o", "StrictHostKeyChecking=accept-new",
            "-o", "ConnectTimeout=20",
            "-i", $keyFile,
            "-p", $port
          )

          Write-Host "==> SSH test"
          & ssh @sshBase $remote "mkdir -p '$remoteDir' && echo SSH_OK"
          if ($LASTEXITCODE -ne 0) {
            throw "SSH that bai. Neu key co passphrase: tao key moi KHONG passphrase. Neu Connection closed: firewall/IP."
          }

          Write-Host "==> Upload archive"
          $scpArgs = @(
            "-o", "BatchMode=yes",
            "-o", "IdentitiesOnly=yes",
            "-o", "StrictHostKeyChecking=accept-new",
            "-o", "ConnectTimeout=20",
            "-i", $keyFile,
            "-P", $port
          )
          & scp @scpArgs "solexpress-deploy.tar.gz" "${remote}:${remoteDir}/solexpress-deploy.tar.gz"
          if ($LASTEXITCODE -ne 0) { throw "SCP upload failed" }

          $be = $env:BE_REMOTE_PATH
          $fe = $env:FE_REMOTE_PATH
          $venv = $env:NODE_VENV_PATH

          $remoteScript = @"
          set -e
          BE_PATH='$be'
          FE_PATH='$fe'
          NODE_VENV='$venv'
          CI_DIR=`$HOME/solexpress-ci
          mkdir -p "`$CI_DIR/extract"
          tar -xzf "`$CI_DIR/solexpress-deploy.tar.gz" -C "`$CI_DIR/extract"
          mkdir -p "`$BE_PATH" "`$FE_PATH"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude '.env' --exclude '.env.*' --exclude 'node_modules' --exclude 'src/logs' "`$CI_DIR/extract/backend/" "`$BE_PATH/"
            rsync -a "`$CI_DIR/extract/frontend/" "`$FE_PATH/"
          else
            cp -R "`$CI_DIR/extract/backend/." "`$BE_PATH/"
            cp -R "`$CI_DIR/extract/frontend/." "`$FE_PATH/"
          fi
          cd "`$BE_PATH"
          if [ -n "`$NODE_VENV" ] && [ -f "`$NODE_VENV/bin/activate" ]; then
            source "`$NODE_VENV/bin/activate"
          fi
          npm install --production --omit=dev
          mkdir -p "`$BE_PATH/tmp"
          touch "`$BE_PATH/tmp/restart.txt"
          rm -rf "`$CI_DIR"
          echo Deploy finished OK
          "@

          $remoteScript = $remoteScript -replace "`r`n", "`n"

          Write-Host "==> Extract, sync, npm install, restart"
          $remoteScript | & ssh @sshBase $remote "bash -s"
          if ($LASTEXITCODE -ne 0) { throw "Remote deploy script failed" }

          Write-Host "Deploy pipeline OK"

      - name: Evaluate results
        id: result
        if: always()
        run: |
          $feOk = "false"
          $beOk = "false"
          $errors = ""

          if ("${{ steps.fe_install.outcome }}" -ne "success") {
            $errors = "- Frontend: npm ci that bai"
          } elseif ("${{ steps.fe_build.outcome }}" -ne "success") {
            $errors = "- Frontend: build that bai"
          } elseif ("${{ steps.prepare.outcome }}" -ne "success") {
            $errors = "- Chuan bi package that bai"
          } elseif ("${{ steps.deploy_ssh.outcome }}" -ne "success") {
            $errors = "- Deploy SSH that bai (runner online + SSH key/passphrase)"
          } else {
            $feOk = "true"
            $beOk = "true"
            $errors = "Khong co"
          }

          "fe_ok=$feOk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "be_ok=$beOk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "errors<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $errors | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($feOk -eq "true" -and $beOk -eq "true") {
            "overall=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "overall=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ACTOR: ${{ steps.meta.outputs.actor }}
          STARTED_AT: ${{ steps.meta.outputs.started_at }}
          FE_OK: ${{ steps.result.outputs.fe_ok }}
          BE_OK: ${{ steps.result.outputs.be_ok }}
          OVERALL: ${{ steps.result.outputs.overall }}
          ERRORS: ${{ steps.result.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $finished = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss") + " UTC"
          if ($env:OVERALL -eq "success") { $title = "✅ Deploy THANH CONG" } else { $title = "❌ Deploy THAT BAI" }
          if ($env:FE_OK -eq "true") { $fe = "✅ Thanh cong" } else { $fe = "❌ That bai" }
          if ($env:BE_OK -eq "true") { $be = "✅ Thanh cong" } else { $be = "❌ That bai" }

          $err = [System.Net.WebUtility]::HtmlEncode($env:ERRORS)
          $text = @"
          <b>$title</b>

          <b>Nhanh:</b> <code>$($env:BRANCH)</code>
          <b>Nguoi chay:</b> <code>$($env:ACTOR)</code>
          <b>Bat dau:</b> <code>$($env:STARTED_AT)</code>
          <b>Ket thuc:</b> <code>$finished</code>
          <b>Runner:</b> self-hosted Windows

          <b>Frontend:</b> $fe
          <b>Backend:</b> $be

          <b>Loi:</b>
          <pre>$err</pre>

          <a href="$($env:RUN_URL)">Xem chi tiet GitHub Actions</a>
          "@

          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            parse_mode = "HTML"
            text = $text
          }
          Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -Body $body | Out-Null

      - name: Fail job if deploy incomplete
        if: always() && steps.result.outputs.overall != 'success'
        run: |
          Write-Error "Deploy that bai — xem Telegram / log Actions"
          exit 1
