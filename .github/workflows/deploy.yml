name: Deploy to cPanel

# Chỉ chạy khi bấm "Run workflow" trên GitHub Actions
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build meta
        id: meta
        run: |
          echo "started_at=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"
          PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          echo "ssh_port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: |
            backend.solexpress/package-lock.json
            portal.solexpress/package-lock.json

      - name: Install frontend dependencies
        id: fe_install
        continue-on-error: true
        working-directory: portal.solexpress
        run: npm ci

      - name: Build frontend
        id: fe_build
        continue-on-error: true
        if: steps.fe_install.outcome == 'success'
        working-directory: portal.solexpress
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false
        run: npm run build

      - name: Prepare deploy packages
        id: prepare
        continue-on-error: true
        if: steps.fe_build.outcome == 'success'
        run: |
          mkdir -p deploy/backend deploy/frontend

          rsync -a \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'src/logs' \
            --exclude '*.zip' \
            --exclude '.vscode' \
            backend.solexpress/ deploy/backend/

          rsync -a portal.solexpress/build/ deploy/frontend/

          # 1 file duy nhất → ít kết nối SSH hơn (tránh firewall cPanel chặn)
          tar -czf solexpress-deploy.tar.gz -C deploy backend frontend
          ls -lh solexpress-deploy.tar.gz

      - name: Test SSH connectivity
        id: ssh_test
        continue-on-error: true
        if: steps.prepare.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ steps.meta.outputs.ssh_port }}
          timeout: 60s
          command_timeout: 30s
          script: |
            set -e
            echo "SSH OK as $(whoami) on $(hostname)"
            echo "Home=$HOME"
            mkdir -p "$HOME/solexpress-ci"
            touch "$HOME/solexpress-ci/.write-test"
            rm -f "$HOME/solexpress-ci/.write-test"
            command -v rsync >/dev/null || echo "WARN: rsync missing"
            command -v tar >/dev/null
            test -d "${{ secrets.BE_REMOTE_PATH }}" || echo "WARN: BE_REMOTE_PATH not found: ${{ secrets.BE_REMOTE_PATH }}"
            test -d "${{ secrets.FE_REMOTE_PATH }}" || echo "WARN: FE_REMOTE_PATH not found: ${{ secrets.FE_REMOTE_PATH }}"

      - name: Upload deploy archive (single SCP)
        id: upload
        continue-on-error: true
        if: steps.ssh_test.outcome == 'success'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ steps.meta.outputs.ssh_port }}
          source: "solexpress-deploy.tar.gz"
          target: "~/solexpress-ci"
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Extract, sync, npm install & restart
        id: sync
        continue-on-error: true
        if: steps.upload.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ steps.meta.outputs.ssh_port }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e

            BE_PATH="${{ secrets.BE_REMOTE_PATH }}"
            FE_PATH="${{ secrets.FE_REMOTE_PATH }}"
            NODE_VENV="${{ secrets.NODE_VENV_PATH }}"
            CI_DIR="$HOME/solexpress-ci"

            echo "==> Extract archive"
            mkdir -p "$CI_DIR/extract"
            tar -xzf "$CI_DIR/solexpress-deploy.tar.gz" -C "$CI_DIR/extract"

            echo "==> Sync backend (keep .env & node_modules)"
            mkdir -p "$BE_PATH"
            rsync -a \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude 'node_modules' \
              --exclude 'src/logs' \
              "$CI_DIR/extract/backend/" "$BE_PATH/"

            echo "==> Sync frontend"
            mkdir -p "$FE_PATH"
            rsync -a "$CI_DIR/extract/frontend/" "$FE_PATH/"

            echo "==> Install backend dependencies"
            cd "$BE_PATH"
            if [ -n "$NODE_VENV" ] && [ -f "$NODE_VENV/bin/activate" ]; then
              # shellcheck disable=SC1090
              source "$NODE_VENV/bin/activate"
            fi
            npm install --production --omit=dev

            echo "==> Restart Node.js app (Passenger)"
            mkdir -p "$BE_PATH/tmp"
            touch "$BE_PATH/tmp/restart.txt"

            rm -rf "$CI_DIR"
            echo "Deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Evaluate results
        id: result
        if: always()
        run: |
          FE_OK=false
          BE_OK=false
          ERRORS=""

          if [ "${{ steps.fe_install.outcome }}" != "success" ]; then
            ERRORS="- Frontend: npm ci thất bại"
          elif [ "${{ steps.fe_build.outcome }}" != "success" ]; then
            ERRORS="- Frontend: build thất bại"
          elif [ "${{ steps.prepare.outcome }}" != "success" ]; then
            ERRORS="- Chuẩn bị package thất bại"
          elif [ "${{ steps.ssh_test.outcome }}" != "success" ]; then
            ERRORS="- SSH kết nối thất bại (sai host/user/key/passphrase/port, hoặc firewall chặn GitHub Actions)"
          elif [ "${{ steps.upload.outcome }}" != "success" ]; then
            ERRORS="- Upload archive thất bại (SCP/firewall/quota)"
          elif [ "${{ steps.sync.outcome }}" != "success" ]; then
            ERRORS="- Sync/npm install/restart thất bại trên server"
          else
            FE_OK=true
            BE_OK=true
            ERRORS="Không có"
          fi

          {
            echo "fe_ok=$FE_OK"
            echo "be_ok=$BE_OK"
            echo "errors<<EOF"
            echo "$ERRORS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$FE_OK" = "true" ] && [ "$BE_OK" = "true" ]; then
            echo "overall=success" >> "$GITHUB_OUTPUT"
          else
            echo "overall=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ACTOR: ${{ steps.meta.outputs.actor }}
          STARTED_AT: ${{ steps.meta.outputs.started_at }}
          FE_OK: ${{ steps.result.outputs.fe_ok }}
          BE_OK: ${{ steps.result.outputs.be_ok }}
          OVERALL: ${{ steps.result.outputs.overall }}
          ERRORS: ${{ steps.result.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FINISHED_AT=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          if [ "$OVERALL" = "success" ]; then
            TITLE="✅ Deploy THÀNH CÔNG"
          else
            TITLE="❌ Deploy THẤT BẠI"
          fi

          if [ "$FE_OK" = "true" ]; then
            FE_STATUS="✅ Thành công"
          else
            FE_STATUS="❌ Thất bại"
          fi

          if [ "$BE_OK" = "true" ]; then
            BE_STATUS="✅ Thành công"
          else
            BE_STATUS="❌ Thất bại"
          fi

          ERRORS_ESCAPED=$(printf '%s' "$ERRORS" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          MESSAGE=$(cat <<EOF
          <b>${TITLE}</b>

          <b>Nhánh:</b> <code>${BRANCH}</code>
          <b>Người chạy:</b> <code>${ACTOR}</code>
          <b>Bắt đầu:</b> <code>${STARTED_AT}</code>
          <b>Kết thúc:</b> <code>${FINISHED_AT}</code>

          <b>Frontend:</b> ${FE_STATUS}
          <b>Backend:</b> ${BE_STATUS}

          <b>Lỗi:</b>
          <pre>${ERRORS_ESCAPED}</pre>

          <a href="${RUN_URL}">Xem chi tiết trên GitHub Actions</a>
          EOF
          )

          MESSAGE=$(printf '%s' "$MESSAGE" | sed 's/^[[:space:]]*//')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${MESSAGE}"

      - name: Fail job if deploy incomplete
        if: always() && steps.result.outputs.overall != 'success'
        run: |
          echo "Deploy thất bại — xem Telegram / log Actions"
          exit 1
